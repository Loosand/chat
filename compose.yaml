name: chat

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chat-local-only}
      POSTGRES_USER: chat
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    volumes:
      - chat-postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://chat:${POSTGRES_PASSWORD:-chat-local-only}@postgres:5432/chat
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://chat:${POSTGRES_PASSWORD:-chat-local-only}@postgres:5432/chat
      JOB_DRIVER: inline
      STORAGE_DRIVER: local
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "${CHAT_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  chat-postgres:
